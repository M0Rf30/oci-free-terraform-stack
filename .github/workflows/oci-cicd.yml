---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Execute OCI Pipeline"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        default: "apply"
        options:
          - plan
          - apply
          - destroy
      region:
        description: "OCI region (must be subscribed and match the state bucket region)"
        required: true
        default: "eu-milan-1"
        type: string
      state_bucket:
        description: "Existing OCI Object Storage bucket for Terraform state"
        required: true
        default: "tf-state"
        type: string

permissions:
  contents: read

concurrency:
  # Never let two state-mutating runs race on the same remote state.
  group: oci-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  OCI_REGION: ${{ inputs.region }}
  OCI_STATE_BUCKET: ${{ inputs.state_bucket }}
  # OCI Object Storage S3-compatible credentials (an OCI Customer Secret Key)
  # used only by the Terraform S3 state backend.
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
# OCI's S3-compat layer rejects the AWS SDK's default aws-chunked encoding.
  AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
  AWS_RESPONSE_CHECKSUM_VALIDATION: "WHEN_REQUIRED"


jobs:
  terraform:
    name: "Terraform OCI Pipeline"
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Write OCI API signing key
        run: |
          umask 077
          printf '%s\n' "${{ secrets.PKEY }}" > pkey.pem
          # Normalise potential CRLF from the secret store.
          sed -i 's/\r$//' pkey.pem
          echo "TF_VAR_pkey_path=$(pwd)/pkey.pem" >> "$GITHUB_ENV"

      - name: Preflight - validate credentials
        run: |
          set -euo pipefail
          # 1) Key must be a valid, unencrypted PEM private key.
          if ! openssl pkey -in pkey.pem -noout 2>/dev/null; then
            echo "::error::PKEY is not a valid PEM private key. OCI needs an API"
            echo "::error::signing key in PEM (RSA/PKCS8) form, NOT an OpenSSH key."
            exit 1
          fi
          # 2) Computed fingerprint must match the FP secret.
          computed="$(openssl rsa -pubout -outform DER -in pkey.pem 2>/dev/null \
                       | openssl md5 -c | awk '{print $NF}')"
          configured="${{ secrets.FP }}"
          echo "computed fingerprint:   $computed"
          echo "configured fingerprint: $configured"
          if [ "$computed" != "$configured" ]; then
            echo "::error::FP secret does not match the PKEY fingerprint."
            echo "::error::Set FP to: $computed (or upload the matching public key in OCI)."
            exit 1
          fi
          echo "Credentials preflight passed."

      - name: Export Terraform variables
        run: |
          {
            echo "TF_VAR_tenancy_ocid=${{ secrets.TENANCY_OCID }}"
            echo "TF_VAR_user_ocid=${{ secrets.USER_OCID }}"
            echo "TF_VAR_fp=${{ secrets.FP }}"
            echo "TF_VAR_region=${OCI_REGION}"
            echo "TF_VAR_ssh_pub_key=${{ secrets.SSH_PUB_KEY }}"
            echo "TF_VAR_wg_client_pubkey=${{ secrets.WG_CLIENT_PUBKEY }}"
          } >> "$GITHUB_ENV"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Resolve OCI Object Storage namespace
        env:
          OCI_TENANCY_OCID: ${{ secrets.TENANCY_OCID }}
        run: |
          set -euo pipefail
          python -m pip install --quiet oci-cli
          mkdir -p "$HOME/.oci"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${TF_VAR_user_ocid}
          fingerprint=${TF_VAR_fp}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=$(pwd)/pkey.pem
          EOF
          chmod 600 "$HOME/.oci/config"
          namespace="$(oci os ns get --auth api_key --region "$OCI_REGION" --query data --raw-output)"
          if [[ -z "$namespace" ]]; then
            echo "::error::OCI returned an empty Object Storage namespace."
            exit 1
          fi
          echo "OCI_OBJECT_STORAGE_NAMESPACE=$namespace" >> "$GITHUB_ENV"

      - name: Ensure Terraform state bucket exists
        env:
          OCI_TENANCY_OCID: ${{ secrets.TENANCY_OCID }}
        run: |
          set -euo pipefail
          if ! oci os bucket get \
            --namespace-name "$OCI_OBJECT_STORAGE_NAMESPACE" \
            --bucket-name "$OCI_STATE_BUCKET" \
            --region "$OCI_REGION" \
            --auth api_key >/dev/null 2>&1; then
            oci os bucket create \
              --compartment-id "$OCI_TENANCY_OCID" \
              --name "$OCI_STATE_BUCKET" \
              --namespace-name "$OCI_OBJECT_STORAGE_NAMESPACE" \
              --region "$OCI_REGION" \
              --public-access-type NoPublicAccess \
              --auth api_key
          fi

      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="region=${OCI_REGION}" \
            -backend-config="bucket=${OCI_STATE_BUCKET}" \
            -backend-config="endpoints={s3=\"https://${OCI_OBJECT_STORAGE_NAMESPACE}.compat.objectstorage.${OCI_REGION}.oraclecloud.com\"}"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -no-color
          else
            terraform plan -input=false -no-color
          fi

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: |
          # OCI free-tier A1 capacity is transient; retry an idempotent apply.
          for attempt in 1 2 3; do
            if terraform apply -auto-approve -input=false -no-color; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Terraform apply failed; retrying in 60 seconds (attempt $((attempt + 1))/3)."
              sleep 60
            fi
          done
          exit 1

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false -no-color

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output -no-color || true
